<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <!-- Elegant Blue Gradients -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ECBF5"/>
      <stop offset="50%" stop-color="#3A86FF"/>
      <stop offset="100%" stop-color="#4361EE"/>
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
    
    <radialGradient id="glowEffect" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6ECBF5" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4361EE" stop-opacity="0.1"/>
    </radialGradient>
    
    <!-- Elegant Pattern -->
    <pattern id="geometricPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="15" fill="none" stroke="#3A86FF" stroke-width="0.5" opacity="0.15"/>
      <circle cx="30" cy="30" r="10" fill="none" stroke="#6ECBF5" stroke-width="0.3" opacity="0.1"/>
    </pattern>
    
    <!-- Elegant Icon Elements -->
    <g id="elegantStar">
      <path d="M0,-12 L3.5,-3.5 L12,0 L3.5,3.5 L0,12 L-3.5,3.5 L-12,0 L-3.5,-3.5 Z" 
            fill="#6ECBF5" opacity="0.9">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
      </path>
    </g>
    
    <g id="techCircle">
      <circle cx="0" cy="0" r="20" fill="none" stroke="url(#mainGradient)" stroke-width="2"/>
      <circle cx="0" cy="0" r="15" fill="none" stroke="#00B4D8" stroke-width="1" stroke-dasharray="4,2">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="10" fill="#3A86FF" opacity="0.3">
        <animate attributeName="r" values="10;12;10" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Text Glow -->
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="#0F1C2E"/>
  <rect width="800" height="400" fill="url(#geometricPattern)"/>
  
  <!-- Main Glow Effect -->
  <ellipse cx="400" cy="200" rx="350" ry="120" fill="url(#glowEffect)" opacity="0.4"/>
  
  <!-- Main Container - Elegant Frame -->
  <rect x="100" y="80" width="600" height="240" rx="30" 
        fill="rgba(15, 28, 46, 0.85)" 
        stroke="url(#mainGradient)" 
        stroke-width="3"
        filter="url(#softGlow)"/>
  
  <!-- Decorative Corner Elements -->
  <g stroke="url(#mainGradient)" stroke-width="2" stroke-linecap="round">
    <!-- Top-left decorative corner -->
    <path d="M120,110 L150,110 L120,140" fill="none" opacity="0.7"/>
    <!-- Top-right decorative corner -->
    <path d="M680,110 L650,110 L680,140" fill="none" opacity="0.7"/>
    <!-- Bottom-left decorative corner -->
    <path d="M120,290 L150,290 L120,260" fill="none" opacity="0.7"/>
    <!-- Bottom-right decorative corner -->
    <path d="M680,290 L650,290 L680,260" fill="none" opacity="0.7"/>
  </g>
  
  <!-- Left Decorative Element -->
  <g transform="translate(200, 200)">
    <use href="#techCircle"/>
    <!-- Subtle floating elements -->
    <circle cx="-25" cy="-25" r="4" fill="#6ECBF5" opacity="0.6">
      <animate attributeName="cy" values="-25;-15;-25" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="25" cy="-15" r="3" fill="#3A86FF" opacity="0.5">
      <animate attributeName="cy" values="-15;-5;-15" dur="4s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
  </g>
  
  <!-- Right Decorative Element -->
  <g transform="translate(600, 200)">
    <use href="#techCircle">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="15s" repeatCount="indefinite"/>
    </use>
    <!-- Subtle floating elements -->
    <circle cx="20" cy="20" r="3.5" fill="#00B4D8" opacity="0.6">
      <animate attributeName="cx" values="20;30;20" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-15" cy="20" r="2.5" fill="#6ECBF5" opacity="0.5">
      <animate attributeName="cx" values="-15;-25;-15" dur="4s" repeatCount="indefinite" begin="1s"/>
    </circle>
  </g>
  
  <!-- Main Logo Text -->
  <g font-family="'Inter', 'Segoe UI', 'Roboto', sans-serif" text-anchor="middle" filter="url(#textGlow)">
    
    <!-- "Iwan" Text - Large and Elegant -->
    <text x="400" y="170" 
          font-size="64" 
          font-weight="700" 
          fill="url(#mainGradient)" 
          letter-spacing="1">
      Iwan
    </text>
    
    <!-- "Sena" Text - Stylish and Connected -->
    <text x="400" y="240" 
          font-size="64" 
          font-weight="700" 
          fill="url(#accentGradient)" 
          letter-spacing="1">
      Sena
    </text>
    
    <!-- Elegant Divider Line -->
    <line x1="300" y1="185" x2="500" y2="185" 
          stroke="url(#mainGradient)" 
          stroke-width="1.5" 
          stroke-linecap="round"
          opacity="0.7"/>
    
    <!-- Subtle Tagline -->
    <text x="400" y="290" 
          font-size="18" 
          font-weight="300" 
          fill="#8ECAE6" 
          letter-spacing="3"
          opacity="0.9">
      CODE • CREATE • INSPIRE
    </text>
  </g>
  
  <!-- Elegant Stars -->
  <g opacity="0.9">
    <use href="#elegantStar" x="150" y="150"/>
    <use href="#elegantStar" x="650" y="150"/>
    <use href="#elegantStar" x="150" y="250"/>
    <use href="#elegantStar" x="650" y="250"/>
  </g>
  
  <!-- Subtle Floating Dots -->
  <g opacity="0.5">
    <circle cx="130" cy="180" r="1.5" fill="#6ECBF5">
      <animate attributeName="cy" values="180;190;180" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="670" cy="180" r="1.5" fill="#3A86FF">
      <animate attributeName="cy" values="180;190;180" dur="3.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="130" cy="220" r="1" fill="#00B4D8">
      <animate attributeName="cy" values="220;210;220" dur="3s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="670" cy="220" r="1" fill="#6ECBF5">
      <animate attributeName="cy" values="220;210;220" dur="4s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
  </g>
  
  <!-- Elegant Border Lines -->
  <g stroke="url(#mainGradient)" stroke-width="1" opacity="0.4">
    <line x1="120" y1="125" x2="680" y2="125" stroke-dasharray="8,4"/>
    <line x1="120" y1="275" x2="680" y2="275" stroke-dasharray="8,4"/>
  </g>
  
  <!-- Bottom Decorative Line -->
  <path d="M250,320 Q400,330 550,320" 
        fill="none" 
        stroke="url(#accentGradient)" 
        stroke-width="2" 
        stroke-linecap="round"
        opacity="0.7">
    <animate attributeName="d" 
             values="M250,320 Q400,330 550,320; M250,320 Q400,340 550,320; M250,320 Q400,330 550,320" 
             dur="6s" 
             repeatCount="indefinite"/>
  </path>
  
  <!-- Signature Element -->
  <g transform="translate(400, 350)" opacity="0.8">
    <path d="M-30,0 Q0,-10 30,0" 
          fill="none" 
          stroke="#3A86FF" 
          stroke-width="1.5" 
          stroke-linecap="round"/>
    <circle cx="-30" cy="0" r="2" fill="#6ECBF5"/>
    <circle cx="0" cy="-10" r="2" fill="#3A86FF">
      <animate attributeName="r" values="2;3;2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="30" cy="0" r="2" fill="#6ECBF5"/>
  </g>
</svg>
