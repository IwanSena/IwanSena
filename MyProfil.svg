<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="800">
  <defs>
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ECBF5"/>
      <stop offset="50%" stop-color="#3A86FF"/>
      <stop offset="100%" stop-color="#4361EE"/>
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
    
    <radialGradient id="glowEffect" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6ECBF5" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4361EE" stop-opacity="0.05"/>
    </radialGradient>
    
    <pattern id="geometricPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="15" fill="none" stroke="#3A86FF" stroke-width="0.5" opacity="0.15"/>
      <circle cx="30" cy="30" r="10" fill="none" stroke="#6ECBF5" stroke-width="0.3" opacity="0.1"/>
    </pattern>
    
    <g id="elegantStar">
      <path d="M0,-8 L2.3,-2.3 L8,0 L2.3,2.3 L0,8 L-2.3,2.3 L-8,0 L-2.3,-2.3 Z" 
            fill="#6ECBF5" opacity="0.9">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
      </path>
    </g>
    
    <g id="techCircle" transform="scale(1.5)">
      <circle cx="0" cy="0" r="15" fill="none" stroke="url(#mainGradient)" stroke-width="2"/>
      <circle cx="0" cy="0" r="12" fill="none" stroke="#00B4D8" stroke-width="1" stroke-dasharray="4,2">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="8" fill="#3A86FF" opacity="0.3">
        <animate attributeName="r" values="8;10;8" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <rect id="containerShape" x="10" y="10" width="1180" height="580" rx="40" />
    <clipPath id="mainContainerClip">
        <use href="#containerShape"/>
    </clipPath>
  </defs>
  
  <g clip-path="url(#mainContainerClip)">
      <rect width="1200" height="600" fill="#0F1C2E"/>
      <rect width="1200" height="600" fill="url(#geometricPattern)"/>
      <ellipse cx="600" cy="300" rx="600" ry="300" fill="url(#glowEffect)" opacity="0.6"/>
  </g>

  <use href="#containerShape" fill="none" stroke="url(#mainGradient)" stroke-width="5" filter="url(#softGlow)"/>
  
  <g stroke="url(#mainGradient)" stroke-width="3" stroke-linecap="round">
    <path d="M50,40 L100,40 L50,90" fill="none" opacity="0.7"/>
    <path d="M1150,40 L1100,40 L1150,90" fill="none" opacity="0.7"/>
    <path d="M50,560 L100,560 L50,510" fill="none" opacity="0.7"/>
    <path d="M1150,560 L1100,560 L1150,510" fill="none" opacity="0.7"/>
  </g>
  
  <g transform="translate(120, 300)">
    <use href="#techCircle"/>
    <circle cx="-25" cy="-25" r="5" fill="#6ECBF5" opacity="0.6">
      <animate attributeName="cy" values="-25;-15;-25" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <g transform="translate(1080, 300)">
    <use href="#techCircle">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="15s" repeatCount="indefinite"/>
    </use>
    <circle cx="20" cy="20" r="5" fill="#00B4D8" opacity="0.6">
      <animate attributeName="cx" values="20;30;20" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <g font-family="'Inter', 'Segoe UI', 'Roboto', sans-serif" text-anchor="middle" filter="url(#textGlow)">
    
    <text x="600" y="240" 
          font-size="130" 
          font-weight="800" 
          fill="url(#mainGradient)" 
          letter-spacing="4">
      Iwan
    </text>
    
    <text x="600" y="380" 
          font-size="130" 
          font-weight="800" 
          fill="url(#accentGradient)" 
          letter-spacing="4">
      Sena
    </text>
    
    <line x1="400" y1="290" x2="800" y2="290" 
          stroke="url(#mainGradient)" 
          stroke-width="4" 
          stroke-linecap="round"
          opacity="0.7"/>
    
    <text x="600" y="450" 
          font-size="32" 
          font-weight="400" 
          fill="#8ECAE6" 
          letter-spacing="8"
          opacity="0.9">
      CODE • CREATE • INSPIRE
    </text>
  </g>
  
  <g opacity="0.8">
    <use href="#elegantStar" x="80" y="80" transform="scale(2)"/>
    <use href="#elegantStar" x="1120" y="80" transform="scale(1.8)"/>
    <use href="#elegantStar" x="80" y="520" transform="scale(1.8)"/>
    <use href="#elegantStar" x="1120" y="520" transform="scale(2)"/>
  </g>
  
  <g stroke="url(#mainGradient)" stroke-width="2" opacity="0.3">
    <line x1="100" y1="160" x2="1100" y2="160" stroke-dasharray="15,20"/>
    <line x1="100" y1="440" x2="1100" y2="440" stroke-dasharray="15,20"/>
  </g>
  
  <path d="M300,520 Q600,560 900,520" 
        fill="none" 
        stroke="url(#accentGradient)" 
        stroke-width="4" 
        stroke-linecap="round"
        opacity="0.6">
    <animate attributeName="d" 
             values="M300,520 Q600,560 900,520; M300,520 Q600,590 900,520; M300,520 Q600,560 900,520" 
             dur="6s" 
             repeatCount="indefinite"/>
  </path>
  
</svg>
