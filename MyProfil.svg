<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ECBF5"/>
      <stop offset="50%" stop-color="#3A86FF"/>
      <stop offset="100%" stop-color="#4361EE"/>
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
    
    <radialGradient id="glowEffect" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6ECBF5" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4361EE" stop-opacity="0.05"/>
    </radialGradient>
    
    <pattern id="geometricPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="15" fill="none" stroke="#3A86FF" stroke-width="0.5" opacity="0.15"/>
      <circle cx="30" cy="30" r="10" fill="none" stroke="#6ECBF5" stroke-width="0.3" opacity="0.1"/>
    </pattern>
    
    <g id="elegantStar">
      <path d="M0,-8 L2.3,-2.3 L8,0 L2.3,2.3 L0,8 L-2.3,2.3 L-8,0 L-2.3,-2.3 Z" 
            fill="#6ECBF5" opacity="0.9">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
      </path>
    </g>
    
    <g id="techCircle" transform="scale(1.3)">
      <circle cx="0" cy="0" r="15" fill="none" stroke="url(#mainGradient)" stroke-width="2"/>
      <circle cx="0" cy="0" r="12" fill="none" stroke="#00B4D8" stroke-width="1" stroke-dasharray="4,2">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="8" fill="#3A86FF" opacity="0.3">
        <animate attributeName="r" values="8;10;8" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <rect id="containerShape" x="10" y="10" width="780" height="380" rx="35" />
    <clipPath id="mainContainerClip">
        <use href="#containerShape"/>
    </clipPath>
  </defs>
  
  <g clip-path="url(#mainContainerClip)">
      <rect width="800" height="400" fill="#0F1C2E"/>
      <rect width="800" height="400" fill="url(#geometricPattern)"/>
      <ellipse cx="400" cy="200" rx="400" ry="200" fill="url(#glowEffect)" opacity="0.6"/>
  </g>

  <use href="#containerShape" fill="none" stroke="url(#mainGradient)" stroke-width="4" filter="url(#softGlow)"/>
  
  <g stroke="url(#mainGradient)" stroke-width="2" stroke-linecap="round" transform="translate(0,0)">
    <path d="M40,30 L80,30 L40,70" fill="none" opacity="0.7"/>
    <path d="M760,30 L720,30 L760,70" fill="none" opacity="0.7"/>
    <path d="M40,370 L80,370 L40,330" fill="none" opacity="0.7"/>
    <path d="M760,370 L720,370 L760,330" fill="none" opacity="0.7"/>
  </g>
  
  <g transform="translate(80, 200)">
    <use href="#techCircle"/>
    <circle cx="-25" cy="-25" r="4" fill="#6ECBF5" opacity="0.6">
      <animate attributeName="cy" values="-25;-15;-25" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <g transform="translate(720, 200)">
    <use href="#techCircle">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="15s" repeatCount="indefinite"/>
    </use>
    <circle cx="20" cy="20" r="4" fill="#00B4D8" opacity="0.6">
      <animate attributeName="cx" values="20;30;20" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <g font-family="'Inter', 'Segoe UI', 'Roboto', sans-serif" text-anchor="middle" filter="url(#textGlow)">
    
    <text x="400" y="155" 
          font-size="85" 
          font-weight="800" 
          fill="url(#mainGradient)" 
          letter-spacing="2">
      Iwan
    </text>
    
    <text x="400" y="245" 
          font-size="85" 
          font-weight="800" 
          fill="url(#accentGradient)" 
          letter-spacing="2">
      Sena
    </text>
    
    <line x1="280" y1="185" x2="520" y2="185" 
          stroke="url(#mainGradient)" 
          stroke-width="2.5" 
          stroke-linecap="round"
          opacity="0.7"/>
    
    <text x="400" y="295" 
          font-size="20" 
          font-weight="400" 
          fill="#8ECAE6" 
          letter-spacing="4"
          opacity="0.9">
      CODE • CREATE • INSPIRE
    </text>
  </g>
  
  <g opacity="0.8">
    <use href="#elegantStar" x="60" y="60" transform="scale(1.5)"/>
    <use href="#elegantStar" x="740" y="60" transform="scale(1.2)"/>
    <use href="#elegantStar" x="60" y="340" transform="scale(1.2)"/>
    <use href="#elegantStar" x="740" y="340" transform="scale(1.5)"/>
  </g>
  
  <g stroke="url(#mainGradient)" stroke-width="1.5" opacity="0.3">
    <line x1="60" y1="110" x2="740" y2="110" stroke-dasharray="10,15"/>
    <line x1="60" y1="280" x2="740" y2="280" stroke-dasharray="10,15"/>
  </g>
  
  <path d="M200,340 Q400,360 600,340" 
        fill="none" 
        stroke="url(#accentGradient)" 
        stroke-width="3" 
        stroke-linecap="round"
        opacity="0.6">
    <animate attributeName="d" 
             values="M200,340 Q400,360 600,340; M200,340 Q400,380 600,340; M200,340 Q400,360 600,340" 
             dur="6s" 
             repeatCount="indefinite"/>
  </path>
  
</svg>
